<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">Deepak Bhati — Full Stack Java Developer, Software Engineer, AI &amp; ML Explorer</title>

  <defs>
    <!-- Background gradient: black / charcoal / deep blue / violet, slowly shifting -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="48%" stop-color="#12162b">
        <animate attributeName="stop-color"
          values="#12162b;#16213e;#1b1440;#12162b"
          dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#241634">
        <animate attributeName="stop-color"
          values="#241634;#2c1b4d;#191233;#241634"
          dur="18s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a5cf6" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#3b3fb5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="titleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a5cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8a5cf6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a5cf6" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#3fa9f5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8a5cf6" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fa9f5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8a5cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3fa9f5" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="microBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="textGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frameClip">
      <rect x="0" y="0" width="1200" height="300" rx="26"/>
    </clipPath>

    <!-- typing clip paths -->
    <clipPath id="clipTitle">
      <rect x="66" y="58" width="0" height="56">
        <animate attributeName="width" from="0" to="560" dur="2s" fill="freeze" begin="0.2s"/>
      </rect>
    </clipPath>

    <clipPath id="clipSub0">
      <rect x="70" y="128" width="0" height="36">
        <animate attributeName="width"
          keyTimes="0;0;0.0375;0.225;0.25;1"
          values="0;0;400;400;0;0"
          dur="16s" repeatCount="indefinite" begin="2.4s"/>
      </rect>
    </clipPath>
    <clipPath id="clipSub1">
      <rect x="70" y="128" width="0" height="36">
        <animate attributeName="width"
          keyTimes="0;0.25;0.2875;0.475;0.5;1"
          values="0;0;280;280;0;0"
          dur="16s" repeatCount="indefinite" begin="2.4s"/>
      </rect>
    </clipPath>
    <clipPath id="clipSub2">
      <rect x="70" y="128" width="0" height="36">
        <animate attributeName="width"
          keyTimes="0;0.5;0.5375;0.725;0.75;1"
          values="0;0;360;360;0;0"
          dur="16s" repeatCount="indefinite" begin="2.4s"/>
      </rect>
    </clipPath>
    <clipPath id="clipSub3">
      <rect x="70" y="128" width="0" height="36">
        <animate attributeName="width"
          keyTimes="0;0.75;0.7875;0.975;1"
          values="0;0;280;280;0"
          dur="16s" repeatCount="indefinite" begin="2.4s"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <!-- base background -->
    <rect x="0" y="0" width="1200" height="300" fill="url(#bgGrad)"/>

    <!-- soft mesh glow, right side -->
    <ellipse cx="960" cy="150" rx="320" ry="220" fill="url(#glowRight)">
      <animate attributeName="opacity" values="0.55;0.85;0.55" dur="9s" repeatCount="indefinite"/>
    </ellipse>

    <!-- decorative orbit rings -->
    <g opacity="0.28">
      <circle cx="1005" cy="150" r="58" fill="none" stroke="#8a5cf6" stroke-width="1"/>
      <circle cx="1005" cy="150" r="86" fill="none" stroke="#3fa9f5" stroke-width="1"/>
      <circle cx="1005" cy="150" r="114" fill="none" stroke="#8a5cf6" stroke-width="0.6"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 1005 150" to="360 1005 150" dur="40s" repeatCount="indefinite"/>
    </g>
    <circle cx="1005" cy="150" r="3.5" fill="#c9d1ff" opacity="0.8">
      <animateMotion dur="9s" repeatCount="indefinite"
        path="M 0,0 A 86 86 0 1 1 0,0.1"/>
    </circle>

    <!-- floating particles -->
    <g fill="#c9d1ff">
      <circle cx="120" cy="60" r="1.6" opacity="0.5">
        <animate attributeName="cy" values="60;30;60" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="230" cy="250" r="2" opacity="0.4">
        <animate attributeName="cy" values="250;210;250" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.5;0.1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="560" cy="40" r="1.4" opacity="0.5">
        <animate attributeName="cy" values="40;15;40" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.55;0.15" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="260" r="1.8" opacity="0.4">
        <animate attributeName="cy" values="260;225;260" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.5;0.1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="830" cy="70" r="1.5" opacity="0.5">
        <animate attributeName="cy" values="70;40;70" dur="7.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.5;0.1" dur="7.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="90" r="1.7" opacity="0.4">
        <animate attributeName="cy" values="90;60;90" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.55;0.1" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1150" cy="230" r="2.1" opacity="0.35">
        <animate attributeName="cy" values="230;195;230" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.45;0.1" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="380" cy="200" r="1.3" opacity="0.4">
        <animate attributeName="cy" values="200;170;200" dur="8.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.5;0.1" dur="8.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="920" cy="255" r="1.6" opacity="0.4">
        <animate attributeName="cy" values="255;220;255" dur="7.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.5;0.1" dur="7.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- soft flowing wave along the bottom -->
    <path d="M -20,268 C 220,238 380,300 620,266 C 860,232 1000,286 1230,254"
          stroke="url(#waveGrad)" stroke-width="1.6" fill="none" opacity="0.55" filter="url(#microBlur)">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M -20,268 C 220,238 380,300 620,266 C 860,232 1000,286 1230,254;
                M -20,258 C 220,286 380,232 620,258 C 860,284 1000,240 1230,266;
                M -20,268 C 220,238 380,300 620,266 C 860,232 1000,286 1230,254"/>
    </path>
    <path d="M -20,282 C 260,258 420,300 660,278 C 900,254 1040,296 1230,272"
          stroke="#3fa9f5" stroke-width="1" fill="none" opacity="0.18" filter="url(#microBlur)">
      <animate attributeName="d" dur="13s" repeatCount="indefinite"
        values="M -20,282 C 260,258 420,300 660,278 C 900,254 1040,296 1230,272;
                M -20,276 C 260,300 420,258 660,286 C 900,300 1040,258 1230,282;
                M -20,282 C 260,258 420,300 660,278 C 900,254 1040,296 1230,272"/>
    </path>

    <!-- faint fading code snippets, background accent -->
    <g font-family="'Cascadia Code','Fira Code',Consolas,monospace" fill="#9fb3ff">
      <text x="845" y="55" font-size="14" opacity="0">const dev = "Deepak";
        <animate attributeName="opacity" values="0;0;0.22;0.22;0;0" keyTimes="0;0.05;0.15;0.55;0.7;1" dur="15s" repeatCount="indefinite" begin="1s"/>
      </text>
      <text x="880" y="205" font-size="14" opacity="0">while (learning) { grow(); }
        <animate attributeName="opacity" values="0;0;0.2;0.2;0;0" keyTimes="0;0.1;0.25;0.6;0.75;1" dur="17s" repeatCount="indefinite" begin="4s"/>
      </text>
      <text x="905" y="235" font-size="13" opacity="0">git commit -m "build"
        <animate attributeName="opacity" values="0;0;0.18;0.18;0;0" keyTimes="0;0.2;0.35;0.65;0.8;1" dur="19s" repeatCount="indefinite" begin="7s"/>
      </text>
    </g>

    <!-- title glow -->
    <ellipse cx="270" cy="88" rx="240" ry="70" fill="url(#titleGlow)" filter="url(#softBlur)">
      <animate attributeName="opacity" values="0.35;0.65;0.35" dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- main title with typing reveal -->
    <g clip-path="url(#clipTitle)">
      <text x="70" y="98" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif"
            font-size="40" font-weight="700" fill="#f5f6fa" filter="url(#textGlow)">Hi 👋, I'm Deepak Bhati</text>
    </g>
    <!-- title cursor -->
    <rect x="70" y="66" width="3.5" height="40" fill="#8a5cf6">
      <animate attributeName="x" from="70" to="630" dur="2s" fill="freeze" begin="0.2s"/>
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite" begin="2.3s"/>
    </rect>

    <!-- cycling subtitle lines (typing + erase) -->
    <g font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="24" font-weight="500" fill="#c9d1ff">
      <g clip-path="url(#clipSub0)"><text x="70" y="153">&gt; Full Stack Java Developer</text></g>
      <g clip-path="url(#clipSub1)"><text x="70" y="153">&gt; Software Engineer</text></g>
      <g clip-path="url(#clipSub2)"><text x="70" y="153">&gt; Open Source Enthusiast</text></g>
      <g clip-path="url(#clipSub3)"><text x="70" y="153">&gt; AI &amp; ML Explorer</text></g>
    </g>
    <!-- subtitle cursors, synced to each line's active window -->
    <g fill="#3fa9f5">
      <rect x="463" y="132" width="3" height="26" opacity="0">
        <animate attributeName="opacity" keyTimes="0;0;0.0375;0.225;0.25;1" values="0;0;1;1;0;0" dur="16s" repeatCount="indefinite" begin="2.4s"/>
      </rect>
      <rect x="343" y="132" width="3" height="26" opacity="0">
        <animate attributeName="opacity" keyTimes="0;0.25;0.2875;0.475;0.5;1" values="0;0;1;1;0;0" dur="16s" repeatCount="indefinite" begin="2.4s"/>
      </rect>
      <rect x="423" y="132" width="3" height="26" opacity="0">
        <animate attributeName="opacity" keyTimes="0;0.5;0.5375;0.725;0.75;1" values="0;0;1;1;0;0" dur="16s" repeatCount="indefinite" begin="2.4s"/>
      </rect>
      <rect x="343" y="132" width="3" height="26" opacity="0">
        <animate attributeName="opacity" keyTimes="0;0.75;0.7875;0.975;1" values="0;0;1;1;0" dur="16s" repeatCount="indefinite" begin="2.4s"/>
      </rect>
    </g>

    <!-- additional info line -->
    <g font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9aa4c7" opacity="0">
      <text x="70" y="200">📍 Greater Noida, India &#160;&#160;&#160;•&#160;&#160;&#160; 🎓 B.Tech CSE Student &#160;&#160;&#160;•&#160;&#160;&#160; 💻 Building Real-World Projects</text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7;1" dur="1s" fill="freeze" begin="3s"/>
    </g>

    <!-- divider line above icons -->
    <line x1="70" y1="228" x2="330" y2="228" stroke="#3fa9f5" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0;0.3" keyTimes="0;0.7;1" dur="1s" fill="freeze" begin="3.3s"/>
    </line>

    <!-- social icon badges -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7;1" dur="1s" fill="freeze" begin="3.5s"/>

      <!-- GitHub -->
      <g transform="translate(70,255)">
        <circle r="24" fill="#ffffff" opacity="0.04"/>
        <circle r="24" fill="none" stroke="url(#borderGrad)" stroke-width="1"/>
        <circle r="24" fill="none" stroke="#8a5cf6" stroke-width="1" opacity="0.35">
          <animate attributeName="r" values="20;27;20" dur="3.2s" repeatCount="indefinite" begin="0s"/>
          <animate attributeName="opacity" values="0.35;0;0.35" dur="3.2s" repeatCount="indefinite" begin="0s"/>
        </circle>
        <g fill="#e7e9f7">
          <circle cx="0" cy="-4" r="6.4"/>
          <path d="M -6.4,-2 Q -9,-9 -3.4,-9.6" stroke="#e7e9f7" stroke-width="1.3" fill="none" stroke-linecap="round"/>
          <path d="M 6.4,-2 Q 9,-9 3.4,-9.6" stroke="#e7e9f7" stroke-width="1.3" fill="none" stroke-linecap="round"/>
          <path d="M -5.2,2 Q 0,10 5.2,2 L 5.2,6.5 Q 0,11.5 -5.2,6.5 Z"/>
        </g>
      </g>

      <!-- LinkedIn -->
      <g transform="translate(140,255)">
        <circle r="24" fill="#ffffff" opacity="0.04"/>
        <circle r="24" fill="none" stroke="url(#borderGrad)" stroke-width="1"/>
        <circle r="24" fill="none" stroke="#3fa9f5" stroke-width="1" opacity="0.35">
          <animate attributeName="r" values="20;27;20" dur="3.2s" repeatCount="indefinite" begin="0.5s"/>
          <animate attributeName="opacity" values="0.35;0;0.35" dur="3.2s" repeatCount="indefinite" begin="0.5s"/>
        </circle>
        <text x="0" y="7" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700"
              text-anchor="middle" fill="#e7e9f7">in</text>
      </g>

      <!-- Portfolio (globe) -->
      <g transform="translate(210,255)">
        <circle r="24" fill="#ffffff" opacity="0.04"/>
        <circle r="24" fill="none" stroke="url(#borderGrad)" stroke-width="1"/>
        <circle r="24" fill="none" stroke="#8a5cf6" stroke-width="1" opacity="0.35">
          <animate attributeName="r" values="20;27;20" dur="3.2s" repeatCount="indefinite" begin="1s"/>
          <animate attributeName="opacity" values="0.35;0;0.35" dur="3.2s" repeatCount="indefinite" begin="1s"/>
        </circle>
        <g fill="none" stroke="#e7e9f7" stroke-width="1.2">
          <circle r="8.5"/>
          <ellipse rx="3.6" ry="8.5"/>
          <line x1="-8.5" y1="0" x2="8.5" y2="0"/>
        </g>
      </g>

      <!-- Email -->
      <g transform="translate(280,255)">
        <circle r="24" fill="#ffffff" opacity="0.04"/>
        <circle r="24" fill="none" stroke="url(#borderGrad)" stroke-width="1"/>
        <circle r="24" fill="none" stroke="#3fa9f5" stroke-width="1" opacity="0.35">
          <animate attributeName="r" values="20;27;20" dur="3.2s" repeatCount="indefinite" begin="1.5s"/>
          <animate attributeName="opacity" values="0.35;0;0.35" dur="3.2s" repeatCount="indefinite" begin="1.5s"/>
        </circle>
        <g fill="none" stroke="#e7e9f7" stroke-width="1.3">
          <rect x="-9" y="-6.5" width="18" height="13" rx="2"/>
          <path d="M -9,-6 L 0,2 L 9,-6"/>
        </g>
      </g>
    </g>

    <!-- outer rounded frame -->
    <rect x="2" y="2" width="1196" height="296" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
